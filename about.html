<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio - About & Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="main-header">
        <h1>About Me & Contact</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="about.html">About & Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Background</h2>
            <p>I am currently studying Environmental Science, Principles of Management, and Web Development.</p>
        </section>

        <section class="card">
            <h2>Get in Touch</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Contact Form</legend>
                    
                    <div>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div>
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="4" required></textarea>
                    </div>
                    
                    <button type="submit">Send</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kashay. All rights reserved.</p>
    </footer>

</body>
</html>
